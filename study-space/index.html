<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0B1220">

    <title>My Study Space | Premium Dashboard</title>

    <!-- Main CSS File -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- =========================
         MAIN APPLICATION
    ========================== -->

    <div class="app-container">

        <!-- HEADER SECTION -->

        <header class="header">

            <div class="logo">
                <span class="logo-icon">✦</span>
                <span>STUDY<span class="gold">SPACE</span></span>
            </div>

            <div class="header-right">
                <span class="status">MY PERSONAL LIBRARY</span>
            </div>

        </header>


        <!-- MAIN CONTENT -->

        <main id="app">

            <!-- HOME PAGE -->

            <section id="home-page" class="page active">

                <div class="hero-section">

                    <p class="eyebrow">
                        YOUR PERSONAL LEARNING SPACE
                    </p>

                    <h1>
                        Welcome to Your
                        <span class="gold">Study Space.</span>
                    </h1>

                    <p class="hero-description">
                        Organize your knowledge.
                        Focus on your goals.
                        Build your future.
                    </p>

                </div>


                <!-- SUBJECT CARDS -->

                <div class="subject-section">

                    <div class="section-heading">
                        <h2>Your Subjects</h2>

                        <p>
                            Choose a subject to explore your notes.
                        </p>
                    </div>


                    <div class="subject-grid">

                        <!-- PHYSICS -->

                        <button class="subject-card physics-card"
                                data-page="physics">

                            <span class="subject-number">01</span>

                            <span class="subject-icon">⚛</span>

                            <span class="subject-name">
                                Physics
                            </span>

                            <span class="subject-info">
                                First & Second Paper
                            </span>

                            <span class="card-arrow">↗</span>

                        </button>


                        <!-- CHEMISTRY -->

                        <button class="subject-card chemistry-card"
                                data-page="chemistry">

                            <span class="subject-number">02</span>

                            <span class="subject-icon">⚗</span>

                            <span class="subject-name">
                                Chemistry
                            </span>

                            <span class="subject-info">
                                First & Second Paper
                            </span>

                            <span class="card-arrow">↗</span>

                        </button>


                        <!-- MATHEMATICS -->

                        <button class="subject-card math-card"
                                data-page="math">

                            <span class="subject-number">03</span>

                            <span class="subject-icon">∑</span>

                            <span class="subject-name">
                                Mathematics
                            </span>

                            <span class="subject-info">
                                First & Second Paper
                            </span>

                            <span class="card-arrow">↗</span>

                        </button>


                        <!-- ENGLISH -->

                        <button class="subject-card english-card"
                                data-page="english">

                            <span class="subject-number">04</span>

                            <span class="subject-icon">Aa</span>

                            <span class="subject-name">
                                English
                            </span>

                            <span class="subject-info">
                                Grammar & Vocabulary
                            </span>

                            <span class="card-arrow">↗</span>

                        </button>

                    </div>

                </div>

            </section>


            <!-- DYNAMIC PAGE CONTAINER -->

            <!--
                JavaScript will load:
                1. Subject pages
                2. Paper selection
                3. Chapter lists
                4. Individual chapter notes

                All dynamic pages will appear here.
            -->

            <section id="dynamic-page" class="page">

                <button id="back-button" class="back-button">
                    ← Back
                </button>

                <div id="page-content">

                    <!-- Dynamic content goes here -->

                </div>

            </section>

        </main>


        <!-- FOOTER -->

        <footer class="footer">

            <p>
                Designed for Focus.
                Built for Knowledge.
            </p>

            <span>MY STUDY SPACE © 2026</span>

        </footer>

    </div>


    <!-- Main JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
