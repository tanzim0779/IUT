<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set 6 | Higher Mathematics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#07111f;color:#f1f5f9;min-height:100vh}
nav{padding:20px 5%;border-bottom:1px solid #263b55;background:#0d1b2e}
nav a{color:#93c5fd;text-decoration:none;font-weight:bold}
.hero{text-align:center;padding:38px 18px}
.label{color:#60a5fa;font-size:12px;letter-spacing:3px;margin-bottom:12px}
.hero h1{font-size:clamp(25px,5vw,38px);line-height:1.4;margin-bottom:10px}
.hero p,.sub{color:#a7b7cb;line-height:1.7}
main{max-width:850px;width:92%;margin:0 auto 45px}
h2{font-size:22px;margin-bottom:8px}
.sub{font-size:14px;margin-bottom:18px}
.chapters{display:grid;gap:12px}
.chapter{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px;text-align:left;font-size:15px;line-height:1.6;color:#f1f5f9;background:#101f33;border:1px solid #263b55;border-radius:12px;cursor:pointer}
.chapter:hover,.chapter.active{background:#172b45;border-color:#60a5fa}
.num,.arrow{color:#60a5fa;font-weight:bold}
.panel{margin-top:22px;padding:25px;background:#101f33;border:1px solid #263b55;border-radius:14px}
.status{display:inline-block;margin-bottom:14px;padding:5px 10px;border-radius:20px;color:#93c5fd;background:#1d3b5e;font-size:12px}
.panel h2{font-size:21px;line-height:1.5;margin-bottom:12px}
.panel p{color:#b5c4d7;line-height:1.8}
#future-content{margin-top:20px}
footer{text-align:center;padding:25px 15px;color:#8fa2ba;border-top:1px solid #263b55;font-size:13px}
</style>
</head>
<body>
<nav><a href="index.html">← Back to Home</a></nav>
<header class="hero"><div class="label">HIGHER MATHEMATICS</div><h1 id="set-title">Set 6</h1><p>Select a chapter to view its content area.</p></header>
<main>
<h2>Chapters</h2><p class="sub">Choose a chapter below.</p>
<!-- JavaScript creates the chapter buttons from the data list. -->
<div id="chapter-list" class="chapters"></div>
<!-- FUTURE HTML INSERTION: add notes, formulas, examples, diagrams, or exercises inside #future-content. -->
<section class="panel" aria-live="polite">
<span class="status">PLACEHOLDER</span>
<h2 id="content-title">Select a chapter</h2>
<p id="content-message">New information will be added here soon.</p>
<div id="future-content"></div>
</section>
</main>
<footer>Higher Mathematics Learning Portal</footer>
<script>
/* All six sets and their chapter names. */
const sets = {
1:{title:"Functions and Calculus",chapters:["Functions and Graph of Functions","Differentiation","Integration"]},
2:{title:"Trigonometry",chapters:["Trigonometric Ratios","Trigonometric Ratios of Associated Angles","Inverse Trigonometric Functions and Trigonometric Equations"]},
3:{title:"Coordinate Geometry",chapters:["Straight Lines","The Circle","Conics"]},
4:{title:"Algebra and Number Systems",chapters:["Real Numbers and Inequalities","Complex Numbers","Polynomials and Polynomial Equations","Linear Programming"]},
5:{title:"Counting, Statistics and Probability",chapters:["Permutations and Combinations","Binomial Expansion","Measures of Dispersion and Probability"]},
6:{title:"Vectors and Mechanics",chapters:["Vector","Statics","Motion of Particles in a Plane"]}
};
const data=sets[6];
document.title="Set 6 | "+data.title;
document.getElementById("set-title").textContent="Set 6 — "+data.title;
const list=document.getElementById("chapter-list");
data.chapters.forEach((chapter,index)=>{
 const button=document.createElement("button");
 button.type="button";button.className="chapter";
 const label=document.createElement("span");
 const number=document.createElement("span");
 number.className="num";number.textContent=String(index+1).padStart(2,"0")+"  ";
 label.appendChild(number);label.appendChild(document.createTextNode(chapter));
 const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="→";
 button.appendChild(label);button.appendChild(arrow);
 button.addEventListener("click",()=>{
  document.querySelectorAll(".chapter").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  document.getElementById("content-title").textContent=chapter;
  document.getElementById("content-message").textContent='New information for "'+chapter+'" will be added here soon.';
  /* FUTURE CHAPTER HTML: add chapter-specific content here, inside #future-content. */
  document.getElementById("future-content").replaceChildren();
 });
 list.appendChild(button);
});
</script>
</body>
</html>
