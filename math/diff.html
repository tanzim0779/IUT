
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit Formulas | IUT Mathematics</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 25px 15px;
            background: #05070f;
            color: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        h1 {
            color: #38bdf8;
            font-size: 28px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .formula-card {
            background: #0f172a;
            border: 1px solid #263449;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .formula-card h2 {
            color: #38bdf8;
            font-size: 16px;
            margin-top: 0;
        }

        .formula {
            background: #080d19;
            border-radius: 8px;
            padding: 16px 8px;
            text-align: center;
            overflow-x: auto;
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Limit Formulas</h1>
    <p class="subtitle">IUT Mathematics | Formula Notes</p>

    <section class="formula-card">
        <h2>01. Standard Exponential Limit</h2>
        <div class="formula">
            \[
            \boxed{\lim_{x\to 0}\frac{a^x-1}{x}=\ln a}
            \]
        </div>
    </section>

    <!-- নতুন Limit Formula এখানে যোগ করবে -->

    <footer>
        © 2026 IUT Mathematics
    </footer>

</div>

<script>
    window.addEventListener("load", function () {
        renderMathInElement(document.body, {
            delimiters: [
                {left: "$$", right: "$$", display: true},
                {left: "\\[", right: "\\]", display: true},
                {left: "\\(", right: "\\)", display: false}
            ],
            throwOnError: false
        });
    });
</script>

</body>
</html>
