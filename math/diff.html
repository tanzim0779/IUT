
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics Formula Notes | IUT</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05070f;
            color: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
        }

        header {
            padding: 22px;
            border-bottom: 1px solid #263449;
            background: #0a1020;
        }

        .header-content {
            max-width: 1000px;
            margin: auto;
        }

        header h1 {
            color: #38bdf8;
            font-size: 25px;
            margin: 0;
        }

        header p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 0;
        }

        /* TOPIC MENU */

        .menu {
            background: #0f172a;
            border-bottom: 1px solid #263449;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .menu-content {
            max-width: 1000px;
            margin: auto;
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .menu a {
            text-decoration: none;
            color: #cbd5e1;
            background: #172238;
            border: 1px solid #263449;
            border-radius: 8px;
            padding: 9px 15px;
            white-space: nowrap;
            font-size: 13px;
            transition: 0.2s;
        }

        .menu a:hover,
        .menu a.active {
            color: #38bdf8;
            border-color: #38bdf8;
            background: #102338;
        }

        /* FORMULA CONTENT */

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .topic-title {
            color: #38bdf8;
            font-size: 21px;
            margin-bottom: 18px;
        }

        .formula-card {
            background: #0f172a;
            border: 1px solid #263449;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .formula-card h3 {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 15px;
        }

        .formula {
            background: #080d19;
            border-radius: 8px;
            padding: 18px 8px;
            text-align: center;
            overflow-x: auto;
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 21px;
            }

            .formula-card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

            <p>IUT Mathematics | Formula Collection</p>

        </div>
    </nav>

    <!-- MATHEMATICAL FORMULA RENDERING -->

    <script>
        window.addEventListener("load", function () {

            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "\\(", right: "\\)", display: false}
                ],
                throwOnError: false
            });

        });

        // Menu active state
        document.querySelectorAll(".menu a").forEach(link => {
            link.addEventListener("click", function () {
                document.querySelectorAll(".menu a")
                    .forEach(item => item.classList.remove("active"));

                this.classList.add("active");
            });
        });
    </script>

</body>
</html>
